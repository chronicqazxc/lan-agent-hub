<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Agent Hub</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --text:#1b1f24; --muted:#6b7480;
    --ok:#1a9d57; --warn:#c77d0a; --bad:#cf3b3b; --accent:#3b6fe0; --chip:#eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1216; --panel:#171b21; --line:#262c34; --text:#e6e9ee; --muted:#8b95a3;
      --ok:#3ccf7e; --warn:#e8a73a; --bad:#ef6a6a; --accent:#6c93f5; --chip:#222831; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { font-size:16px; margin:0; }
  .stat { color:var(--muted); } .stat b { color:var(--text); font-variant-numeric:tabular-nums; }
  .live { margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; flex:none; }
  .dot.on { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent); }
  .dot.off { background:var(--muted); }
  main { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:16px; padding:16px 20px; max-width:1400px; margin:auto; }
  @media (max-width:900px){ main{grid-template-columns:1fr;} }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0; }
  section h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; display:flex; justify-content:space-between; }
  #graph { width:100%; height:260px; display:block; }
  #graph text { fill:var(--text); font-size:11px; text-anchor:middle; }
  #graph .edge { stroke:var(--line); stroke-width:1.5; }
  #graph .edge.off { stroke-dasharray:3 4; opacity:.6; }
  #graph .edge.pulse { stroke:var(--accent); stroke-width:3; }
  #graph .node { fill:var(--panel); stroke:var(--ok); stroke-width:2; }
  #graph .node.off { stroke:var(--muted); stroke-dasharray:3 3; }
  #graph .hub { fill:var(--accent); }
  #graph .badge { fill:var(--warn); } #graph .badgetxt { fill:#fff; font-weight:700; }
  .agents { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .card .top { display:flex; align-items:center; gap:8px; font-weight:600; word-break:break-all; }
  .card .meta { color:var(--muted); font-size:12px; margin-top:4px; }
  .chip { display:inline-block; background:var(--chip); border-radius:999px; padding:1px 8px; font-size:11px; margin:3px 4px 0 0; }
  .chip.q { background:color-mix(in srgb,var(--warn) 22%,transparent); color:var(--warn); font-weight:600; }
  .feed { max-height:420px; overflow:auto; }
  .msg { display:grid; grid-template-columns:auto 1fr auto; gap:2px 10px; padding:7px 0; border-top:1px solid var(--line); }
  .msg:first-child { border-top:0; }
  .msg .route { font-weight:600; word-break:break-all; } .msg .arrow { color:var(--muted); font-weight:400; }
  .msg .body { grid-column:1/-1; color:var(--muted); font-family:ui-monospace,Menlo,monospace; font-size:12px; word-break:break-word; }
  .time { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .st { font-size:11px; border-radius:4px; padding:1px 7px; font-weight:600; align-self:start; }
  .st.delivered{ background:color-mix(in srgb,var(--ok) 20%,transparent); color:var(--ok); }
  .st.flushed  { background:color-mix(in srgb,var(--accent) 20%,transparent); color:var(--accent); }
  .st.queued   { background:color-mix(in srgb,var(--warn) 22%,transparent); color:var(--warn); }
  .st.unknown  { background:color-mix(in srgb,var(--bad) 20%,transparent); color:var(--bad); }
  .st.no-listeners { background:var(--chip); color:var(--muted); }
  .empty { color:var(--muted); padding:8px 0; }
  .qagent { margin-bottom:10px; } .qagent .qh { font-weight:600; margin-bottom:2px; }
  .full { grid-column:1/-1; }
  .btn { font:inherit; font-size:12px; padding:3px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  .btn.bad { color:var(--bad); } .btn:disabled { opacity:.5; cursor:default; }
  .card .acts { display:flex; gap:6px; margin-top:8px; }
  .chip.inv { background:color-mix(in srgb,var(--accent) 20%,transparent); color:var(--accent); font-weight:600; }
  .invform { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .invform input { font:inherit; padding:6px 9px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); min-width:0; flex:1 1 160px; }
  .code { font-family:ui-monospace,Menlo,monospace; word-break:break-all; background:var(--chip); border-radius:6px; padding:8px 10px; margin-bottom:10px; }
  .inv { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; padding:6px 0; border-top:1px solid var(--line); } .inv:first-of-type { border-top:0; }
  .inv .grow { flex:1 1 140px; font-weight:600; word-break:break-all; }
  #gate { position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; }
  #gate form { background:var(--panel); border:1px solid var(--line); padding:20px; border-radius:10px; display:flex; flex-direction:column; gap:10px; width:min(340px,90vw); }
  #gate input,#gate button { font:inherit; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  #gate button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>LAN Agent Hub</h1>
  <span class="stat">Online <b id="s-online">0</b>/<b id="s-total">0</b></span>
  <span class="stat">Queued <b id="s-queued">0</b></span>
  <span class="stat">Messages <b id="s-msgs">0</b></span>
  <span class="stat">Uptime <b id="s-up">–</b></span>
  <span class="live"><span class="dot" id="live"></span><span id="live-t">connecting…</span></span>
</header>

<main>
  <section><h2>Topology</h2><svg id="graph" viewBox="0 0 520 260" role="img" aria-label="Agents connected to the hub"></svg></section>
  <section><h2>Pending queue <span id="q-total"></span></h2><div id="queues"></div></section>
  <section class="full" id="joinsec"><h2>Join requests <span id="join-count"></span></h2><div id="joins"></div></section>
  <section class="full"><h2>Invites <span id="mode"></span></h2>
    <form class="invform" id="invform"><input id="inv-id" placeholder="agent id (e.g. bob-laptop)" pattern="[A-Za-z0-9._-]{1,64}" required><input id="inv-name" placeholder="note (optional)"><button class="btn">New invite</button></form>
    <div id="newcode"></div><div id="invites"></div></section>
  <section class="full"><h2>Agents</h2><div class="agents" id="agents"></div></section>
  <section class="full"><h2>Message feed <span>newest first</span></h2><div class="feed" id="feed"></div></section>
</main>

<div id="gate"><form id="gate-form"><b>Hub token required</b><input id="tok" type="password" placeholder="token" autofocus><button>Connect</button></form></div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const NS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs = {}, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };

let token = new URLSearchParams(location.search).get('token') || sessionStorage.getItem('lah-token') || '';
const api = async (method, path, body) => {
  const r = await fetch(path + (token ? '?token=' + encodeURIComponent(token) : ''), { method, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) alert(j.error || 'request failed'); return r.ok ? j : null;
};
$('invform').onsubmit = async (e) => {
  e.preventDefault();
  const r = await api('POST', '/api/invites', { agentId: $('inv-id').value.trim(), name: $('inv-name').value.trim() || undefined });
  if (!r) return;
  $('inv-id').value = $('inv-name').value = '';
  const box = $('newcode'); box.replaceChildren();
  box.append(el('div', 'meta', `Invite for "${r.agentId}" — shown once. Give it to that agent as LAH_TOKEN:`), el('div', 'code', r.code));
};
let seen = new Set(), first = true, lastState = null;

const ago = (iso) => { if (!iso) return '–'; const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000 | 0);
  return s < 60 ? s + 's ago' : s < 3600 ? (s / 60 | 0) + 'm ago' : s < 86400 ? (s / 3600 | 0) + 'h ago' : (s / 86400 | 0) + 'd ago'; };
const dur = (s) => s < 60 ? s + 's' : s < 3600 ? (s / 60 | 0) + 'm' : (s / 3600 | 0) + 'h ' + ((s % 3600) / 60 | 0) + 'm';
const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour12: false });

function connect() {
  const es = new EventSource('/api/events' + (token ? '?token=' + encodeURIComponent(token) : ''));
  es.onopen = () => setLive(true);
  es.onmessage = (e) => render(JSON.parse(e.data));
  es.onerror = async () => {
    es.close(); setLive(false);
    const r = await fetch('/api/state' + (token ? '?token=' + encodeURIComponent(token) : '')).catch(() => null);
    if (r && r.status === 401) { $('gate').style.display = 'flex'; return; }
    setTimeout(connect, 2000);
  };
}
function setLive(on) { $('live').className = 'dot ' + (on ? 'on' : 'off'); $('live-t').textContent = on ? 'live' : 'disconnected — retrying'; }
$('gate-form').onsubmit = (e) => { e.preventDefault(); token = $('tok').value; sessionStorage.setItem('lah-token', token); $('gate').style.display = 'none'; connect(); };

function render(st) {
  lastState = st;
  const online = st.agents.filter((a) => a.online).length;
  const queued = st.agents.reduce((n, a) => n + a.queue.length, 0);
  $('s-online').textContent = online; $('s-total').textContent = st.agents.length;
  $('s-queued').textContent = queued; $('s-msgs').textContent = st.messages.length;
  $('s-up').textContent = dur(st.uptimeSec);

  // new messages -> pulse edges
  const fresh = st.messages.filter((m) => !seen.has(m.id));
  st.messages.forEach((m) => seen.add(m.id));
  drawGraph(st, first ? [] : fresh); first = false;

  // join requests (anyone on the LAN can send one: check the agent id and address before approving)
  $('joinsec').style.display = st.joinRequests ? '' : 'none';
  $('join-count').textContent = st.joins.length ? st.joins.length + ' waiting' : '';
  const jl = $('joins'); jl.replaceChildren();
  if (!st.joins.length) jl.append(el('div', 'empty', 'No one is asking to join. Newcomers can run `lah join <agent-id>` or call lan_request_join.'));
  for (const j of st.joins) {
    const row = el('div', 'inv'), ok = el('button', 'btn', 'Approve'), no = el('button', 'btn bad', 'Deny');
    ok.onclick = () => confirm(`Let "${j.agentId}" from ${j.ip} join the hub?`) && api('POST', '/api/joins/' + j.id + '/approve');
    no.onclick = () => api('POST', '/api/joins/' + j.id + '/deny');
    row.append(el('span', 'grow', j.agentId), el('span', 'time', `${j.ip} · ${ago(j.createdAt)}`), ok, no);
    jl.append(row);
  }

  // invites
  $('mode').textContent = st.auth ? (st.inviteOnly ? 'invite-only: the hub token cannot join' : 'hub token or an invite can join') : 'no auth: open to everyone';
  $('invform').style.display = st.auth ? '' : 'none';
  const iv = $('invites'); iv.replaceChildren();
  if (!st.invites.length) iv.append(el('div', 'empty', 'No invites yet. An invite lets one named agent join and can be revoked on its own.'));
  for (const i of st.invites) {
    const row = el('div', 'inv'), b = el('button', 'btn bad', 'Revoke');
    b.onclick = () => confirm(`Revoke ${i.agentId}? It is disconnected and cannot rejoin.`) && api('DELETE', '/api/invites/' + encodeURIComponent(i.agentId));
    row.append(el('span', 'grow', i.agentId), el('span', 'time', (i.name !== i.agentId ? i.name + ' · ' : '') + (i.lastUsedAt ? 'last joined ' + ago(i.lastUsedAt) : 'never joined')), b);
    iv.append(row);
  }

  // agents
  const ag = $('agents'); ag.replaceChildren();
  if (!st.agents.length) ag.append(el('div', 'empty', 'No agents have connected yet.'));
  for (const a of [...st.agents].sort((x, y) => y.online - x.online || x.id.localeCompare(y.id))) {
    const c = el('div', 'card'), top = el('div', 'top');
    top.append(el('span', 'dot ' + (a.online ? 'on' : 'off')), el('span', null, a.id));
    const meta = el('div', 'meta', `${a.kind}${a.description ? ' · ' + a.description : ''}`);
    const m2 = el('div', 'meta', a.online ? `connected ${ago(a.connectedAt)}` : `last seen ${ago(a.lastSeen)}`);
    const m3 = el('div', 'meta', `sent ${a.sent} · received ${a.received}`);
    const chips = el('div');
    if (a.queue.length) chips.append(el('span', 'chip q', a.queue.length + ' queued'));
    a.capabilities.forEach((x) => chips.append(el('span', 'chip', x)));
    a.topics.forEach((x) => chips.append(el('span', 'chip', '#' + x)));
    if (a.invited) chips.append(el('span', 'chip inv', 'invited'));
    const acts = el('div', 'acts'), kick = el('button', 'btn', a.online ? 'Kick' : 'Remove');
    kick.onclick = a.online ? () => api('POST', '/api/agents/' + encodeURIComponent(a.id) + '/kick')
      : () => confirm(`Remove ${a.id}?${a.invited ? ' Its invite is revoked.' : ''} Queued messages are dropped.`) && api('DELETE', '/api/agents/' + encodeURIComponent(a.id));
    acts.append(kick);
    c.append(top, meta, m2, m3, chips, acts); ag.append(c);
  }

  // queues
  const q = $('queues'); q.replaceChildren();
  $('q-total').textContent = queued ? queued + ' waiting' : '';
  const withQ = st.agents.filter((a) => a.queue.length);
  if (!withQ.length) q.append(el('div', 'empty', 'No messages waiting. Queues hold direct messages for offline agents.'));
  for (const a of withQ) {
    const box = el('div', 'qagent'); box.append(el('div', 'qh', `${a.id} (${a.online ? 'online' : 'offline'}) — ${a.queue.length}`));
    for (const m of a.queue) {
      const row = el('div', 'msg'); row.append(el('span', 'route', m.from), el('span', 'time', clock(m.ts)), el('span'), el('div', 'body', m.preview));
      row.style.gridTemplateColumns = '1fr auto'; box.append(row);
    }
    q.append(box);
  }

  // feed
  const f = $('feed'); f.replaceChildren();
  if (!st.messages.length) f.append(el('div', 'empty', 'No traffic yet.'));
  for (const m of [...st.messages].reverse()) {
    const row = el('div', 'msg'), route = el('span', 'route');
    route.append(m.from, el('span', 'arrow', '  →  '), m.to);
    row.append(route, el('span', 'time', clock(m.ts)), el('span', 'st ' + m.status, m.status), el('div', 'body', m.preview));
    f.append(row);
  }
}

function drawGraph(st, fresh) {
  const g = $('graph'); g.replaceChildren();
  const cx = 260, cy = 130, R = 95, n = st.agents.length;
  const pulse = new Set(); fresh.forEach((m) => { pulse.add(m.from); [...m.delivered, ...m.queued].forEach((x) => pulse.add(x)); });
  const pos = {};
  st.agents.forEach((a, i) => { const t = (i / Math.max(n, 1)) * Math.PI * 2 - Math.PI / 2; pos[a.id] = [cx + R * 1.45 * Math.cos(t), cy + R * Math.sin(t)]; });
  for (const a of st.agents) { const [x, y] = pos[a.id];
    g.append(sv('line', { x1: cx, y1: cy, x2: x, y2: y, class: 'edge' + (a.online ? '' : ' off') + (pulse.has(a.id) ? ' pulse' : '') })); }
  g.append(sv('circle', { cx, cy, r: 22, class: 'hub' }), sv('text', { x: cx, y: cy + 4, style: 'fill:#fff;font-weight:700' }, 'HUB'));
  for (const a of st.agents) { const [x, y] = pos[a.id];
    g.append(sv('circle', { cx: x, cy: y, r: 15, class: 'node' + (a.online ? '' : ' off') }));
    g.append(sv('text', { x, y: y + 30 }, a.id.length > 18 ? a.id.slice(0, 17) + '…' : a.id));
    if (a.queue.length) { g.append(sv('circle', { cx: x + 12, cy: y - 12, r: 8, class: 'badge' }), sv('text', { x: x + 12, y: y - 8, class: 'badgetxt' }, a.queue.length)); } }
  if (!n) g.append(sv('text', { x: cx, y: cy + 50 }, 'waiting for agents…'));
  if (pulse.size) setTimeout(() => lastState && drawGraph(lastState, []), 900);
}

setInterval(() => lastState && render(lastState), 15000); // refresh relative times
connect();
</script>
</body>
</html>
